<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Carousel with Text</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Carousel container */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 450px;
      margin: auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* Slides tracking */
    .carousel-slide {
      position: relative;
      width: 100%;
      height: 100%;
      display: none; /* Hidden by default */
    }

    .carousel-slide.active {
      display: block; /* Show active slide */
    }

    /* Images */
    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Text Overlay styling */
    .carousel-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      color: #ffffff;
      padding: 30px 20px 20px 20px;
      text-align: left;
    }

    .carousel-caption h2 {
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .carousel-caption p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* Navigation Buttons */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.7);
      border: none;
      color: #333;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50%;
      transition: background-color 0.3s, color 0.3s;
      z-index: 10;
    }

    .nav-btn:hover {
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
    }

    .prev {
      left: 15px;
    }

    .next {
      right: 15px;
    }

    /* Dots Indicators */
    .dots-container {
      position: absolute;
      bottom: 15px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .dot {
      cursor: pointer;
      height: 12px;
      width: 12px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.6s ease;
    }

    .dot.active, .dot:hover {
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <!-- Slide 1 -->
    <div class="carousel-slide active">
     <!-- <img src="https://picsum.photos" alt="Mountain View"> -->
      <img src="./images/Dean Awards certificate.jpg" class="bb-img-split" title="Dean Award" width="400" height="300">
      <div class="carousel-caption">
      <!--  <h2>Explore the Mountains</h2> -->
        <p>Associate Dean's Award of Excellence - Niagara College Public Relations Program</p>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="carousel-slide">
      <img src="https://picsum.photos" alt="Autumn Woods">
      <div class="carousel-caption">
        <h2>Autumn Trails</h2>
        <p>Experience the vibrant colors of the changing seasons.</p>
      </div>
    </div>

    <!-- Slide 3 -->
    <div class="carousel-slide">
      <img src="https://picsum.photos" alt="Ocean Waves">
      <div class="carousel-caption">
        <h2>Coastal Escape</h2>
        <p>Relax by the soothing rhythm of ocean waves.</p>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>

    <!-- Indicators -->
    <div class="dots-container">
      <span class="dot active" onclick="setSlide(0)"></span>
      <span class="dot" onclick="setSlide(1)"></span>
      <span class="dot" onclick="setSlide(2)"></span>
    </div>
  </div>

  <script>
    let currentSlideIndex = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.dot');

    // Function to update visual slide states
    function showSlide(index) {
      // Handle loop boundaries
      if (index >= slides.length) {
        currentSlideIndex = 0;
      } else if (index < 0) {
        currentSlideIndex = slides.length - 1;
      } else {
        currentSlideIndex = index;
      }

      // Toggle active classes
      slides.forEach((slide, i) => {
        if (i === currentSlideIndex) {
          slide.classList.add('active');
          dots[i].classList.add('active');
        } else {
          slide.classList.remove('active');
          dots[i].classList.remove('active');
        }
      });
    }

    // Button control mapping
    function changeSlide(direction) {
      showSlide(currentSlideIndex + direction);
    }

    // Indicator control mapping
    function setSlide(index) {
      showSlide(index);
    }

    // Optional: Auto-play functionality (cycles every 5 seconds)
    setInterval(() => {
      changeSlide(1);
    }, 5000);
  </script>

</body>
</html>
