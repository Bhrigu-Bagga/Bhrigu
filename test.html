<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expandable Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

details{
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    overflow:hidden;
}

summary{
    list-style:none;
    cursor:pointer;
    padding:20px;
    font-size:22px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

summary::-webkit-details-marker{
    display:none;
}

summary::after{
    content:"+";
    font-size:34px;
    font-weight:300;
    transition:0.3s;
}

details[open] summary::after{
    content:"−";
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}

.gallery img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    transition:.3s;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.gallery img:hover{
    transform:scale(1.05);
}

@media(max-width:768px){
    body{
        padding:20px;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .gallery{
        grid-template-columns:1fr;
    }
}
</style>

</head>
<body>

<div class="container">

    <details>
        <summary>Project Screenshots</summary>

        <div class="gallery">

            <img src="./images/Counci dir award.jpg" alt="Project 1">

            <img src="./images/Dean Awards certificate.jpg" alt="Project 2">

            <img src="./images/Dean Awards certificate.jpg" alt="Project 3">

        </div>

    </details>

</div>

</body>
</html>
